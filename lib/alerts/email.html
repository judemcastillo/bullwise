<!doctype html>
<html lang="en" style="background-color: #050505">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width" />
		<meta name="color-scheme" content="dark" />
		<meta name="supported-color-schemes" content="dark" />
		<style>
			:root {
				color-scheme: dark only;
				supported-color-schemes: dark only;
			}
			html,
			body,
			.email-body,
			.email-background {
				background-color: #050505 !important;
			}
			.email-container {
				background-color: #141414 !important;
			}
		</style>
		<title>${escapeHtml(subject)}</title>
	</head>
	<body
		class="email-body"
		bgcolor="#050505"
		style="
			margin: 0;
			background-color: #050505;
			color: #fff;
			font-family: Arial, sans-serif;
		"
	>
		<div style="background-color: #000000">
			<div style="background-color: #050505">
				<table
					role="presentation"
					width="100%"
					cellpadding="0"
					cellspacing="0"
					border="0"
					class="email-background"
					bgcolor="#050505"
					style="background-color: #050505"
				>
					<tr>
						<td
							align="center"
							bgcolor="#050505"
							style="padding: 32px 16px; background-color: #050505"
						>
							<table
								role="presentation"
								width="100%"
								cellpadding="0"
								cellspacing="0"
								border="0"
								class="email-container"
								bgcolor="#141414"
								style="
									max-width: 600px;
									background-color: #141414;
									border: 1px solid #30333a;
									border-radius: 10px;
								"
							>
								<tr>
									<td
										style="
											padding: 32px;
											background-color: #141414;
											color: #fff;
											border-radius: 10px;
										"
									>
										${testBanner}
										<p>PRICE ALERT</p>
										<h1
											style="margin: 0 0 8px; color: #ffffff; font-size: 28px"
										>
											${symbol}
										</h1>
										<p style="margin: 0 0 28px; color: #9ca3af">${name}</p>
										<p
											style="color: #ffffff; font-size: 18px; line-height: 1.6"
										>
											The price crossed
											<strong style="color: #ffffff">${direction}</strong> your
											target of
											<strong style="color: #ffffff">${threshold}</strong>.
										</p>
										<div
											style="
												margin: 24px 0;
												padding: 20px;
												background-color: #212328;
												border-radius: 8px;
											"
										>
											<p style="margin: 0 0 6px; color: #9ca3af">
												Observed price
											</p>
											<p>${observed}</p>
										</div>
										<p style="color: #9ca3af; font-size: 14px">
											Triggered at ${timestamp}
										</p>
										<a
											href="${url}"
											style="
												display: inline-block;
												margin-top: 16px;
												padding: 14px 22px;
												background-color: #fdd458;
												color: #050505;
												text-decoration: none;
												border-radius: 8px;
												font-weight: 700;
											"
											>View Bull Wise</a
										>
										<p
											style="
												margin: 32px 0 0;
												color: #6b7280;
												font-size: 12px;
												line-height: 1.5;
											"
										>
											This is a notification for an alert you created. It is not
											financial advice.
										</p>
									</td>
								</tr>
							</table>
						</td>
					</tr>
				</table>
			</div>
		</div>
	</body>
</html>
